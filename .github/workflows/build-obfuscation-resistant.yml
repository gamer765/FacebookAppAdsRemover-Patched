name: Build obfuscation-resistant experiment

on:
  push:
    branches:
      - experiment/obfuscation-resistant-hooks
      - experiment/obfuscation-resistant-hooks-579-fix2
    paths:
      - 'source/**'
      - 'scripts/strict_all_features.py'
      - '.github/workflows/build-obfuscation-resistant.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable exact-version fast paths
        run: python3 scripts/strict_all_features.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build experimental release APK
        run: |
          cd source
          gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacebookAppAdsRemover-v1.10.0-obfexp23-fb580-dynamicstatecontinuity-unsigned
          path: source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Package Android APK signer
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          mkdir -p apk-signing-tools/lib
          cp "$TOOL_DIR/apksigner" apk-signing-tools/
          cp "$TOOL_DIR/lib/apksigner.jar" apk-signing-tools/lib/
          chmod +x apk-signing-tools/apksigner

      - name: Upload Android APK signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apk-signing-tools/
          if-no-files-found: error
