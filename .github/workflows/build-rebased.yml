name: Build rebased upstream experiment

on:
  push:
    branches:
      - rebase/upstream-1.25-exp29
      - experiment/obfuscation-resistant-hooks
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-rebased.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacebookAppAdsRemover-v1.25-gamer765-rebase1-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Package Android APK signer
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          mkdir -p apk-signing-tools/lib
          cp "$TOOL_DIR/apksigner" apk-signing-tools/
          cp "$TOOL_DIR/lib/apksigner.jar" apk-signing-tools/lib/
          chmod +x apk-signing-tools/apksigner

      - name: Upload Android APK signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apk-signing-tools/
          if-no-files-found: error
