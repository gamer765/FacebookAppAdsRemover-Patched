name: Build patched FacebookAppAdsRemover

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Clone upstream v1.9
        run: git clone --depth 1 --branch 1.9 https://github.com/Loukious/FacebookAppAdsRemover.git upstream

      - name: Apply patch
        run: |
          cp scripts/patch_v1_9.py upstream/patch_v1_9.py
          cp scripts/patch_v1_9_4.py upstream/patch_v1_9_4.py
          cp scripts/patch_v1_9_4_fix.py upstream/patch_v1_9_4_fix.py
          cp scripts/patch_v1_9_5.py upstream/patch_v1_9_5.py
          cd upstream
          python3 patch_v1_9.py
          python3 patch_v1_9_4.py
          python3 patch_v1_9_4_fix.py
          python3 patch_v1_9_5.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: |
          cd upstream
          gradle --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FacebookAppAdsRemover-v1.9.5-patched-unsigned
          path: upstream/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
